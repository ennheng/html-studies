<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type in Motion — Kinetic Typography Playground</title>
<style>
:root{--paper:#f1efe7;--ink:#151515;--acid:#ff5a36;--line:#c9c5b9;--speed:1;--weight:600}*{box-sizing:border-box}html{background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acid);outline-offset:4px}.top{height:74px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-weight:900;letter-spacing:-1.5px;font-size:21px}.brand i{display:inline-block;width:12px;height:12px;background:var(--acid);border-radius:50%;margin-right:10px}.edition{font:11px/1.4 monospace;letter-spacing:1px;text-transform:uppercase}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 74px)}aside{border-right:1px solid var(--ink);padding:28px 24px;display:flex;flex-direction:column;gap:28px;background:#e8e5dc}.intro{font-size:12px;line-height:1.55;margin:0;color:#4d4b45}.field{border:0;padding:0;margin:0}.field legend,.label{display:block;font:700 10px monospace;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:11px}.word-input{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:10px 0;font-size:21px;font-weight:700;border-radius:0}.word-input::placeholder{color:#77746b}.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mode{border:1px solid #99968c;background:transparent;padding:10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px}.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.range{margin-bottom:20px}.range-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.range output{font-family:monospace}input[type="range"]{width:100%;height:3px;appearance:none;background:#aaa69a;accent-color:var(--acid);display:block}input[type="range"]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--acid);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--ink)}.actions{margin-top:auto;display:grid;gap:8px}.action{padding:13px;border:1px solid var(--ink);background:transparent;text-transform:uppercase;font:700 10px monospace;letter-spacing:1px}.action.primary{background:var(--acid);border-color:var(--acid)}.action:hover{transform:translateY(-2px);box-shadow:3px 3px 0 var(--ink)}main{position:relative;min-width:0;display:flex;flex-direction:column}.stage{position:relative;flex:1;min-height:590px;overflow:hidden;isolation:isolate;touch-action:none;background-image:linear-gradient(#d6d2c7 1px,transparent 1px),linear-gradient(90deg,#d6d2c7 1px,transparent 1px);background-size:40px 40px}.stage::after{content:"MOVE YOUR CURSOR THROUGH THE TYPE";position:absolute;bottom:22px;left:26px;font:10px monospace;letter-spacing:1.5px;color:#69665e;pointer-events:none}.sculpture{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:800px}.glyph{position:absolute;font-size:clamp(56px,10vw,156px);font-weight:var(--weight);line-height:.8;letter-spacing:-.09em;will-change:transform;user-select:none;white-space:pre;transform-origin:center}.glyph:nth-child(3n){color:var(--acid)}.axis{position:absolute;background:var(--ink);opacity:.2;pointer-events:none}.axis.x{height:1px;width:100%;top:50%}.axis.y{width:1px;height:100%;left:50%}.counter{position:absolute;top:20px;right:22px;font:10px monospace;border:1px solid var(--ink);padding:7px 9px;background:var(--paper)}.statusbar{border-top:1px solid var(--ink);display:flex;justify-content:space-between;align-items:center;padding:15px 24px;font:10px monospace;letter-spacing:.5px}.live{display:flex;align-items:center;gap:8px}.live:before{content:"";width:7px;height:7px;background:var(--acid);border-radius:50%;animation:blink 1.8s infinite}.paused .live:before{animation:none;background:#777}.hint{color:#666}@keyframes blink{50%{opacity:.2}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){.top{height:60px;padding:0 18px}.edition{font-size:9px}.layout{display:flex;flex-direction:column}main{order:-1}.stage{min-height:54vh}.statusbar{padding:12px 16px}.hint{display:none}aside{border-right:0;border-top:1px solid var(--ink);padding:24px 18px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.intro{grid-column:1/-1}.field.ranges{grid-column:1/-1}.actions{margin:0}.glyph{font-size:clamp(52px,18vw,100px)}.stage::after{font-size:8px;left:16px;bottom:15px}}@media(max-width:430px){aside{grid-template-columns:1fr}.field.ranges,.intro{grid-column:auto}.modes{grid-template-columns:repeat(4,1fr)}.mode{font-size:9px}.actions{grid-template-columns:1fr 1fr}.stage{min-height:48vh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.glyph{will-change:auto}}
</style>
</head>
<body>
<header class="top"><div class="brand"><i></i>TYPE / IN MOTION</div><div class="edition">Kinetic studies<br>No. 011 — 2026</div></header>
<div class="layout">
<aside aria-label="Typography controls">
<p class="intro">A small laboratory for unruly letters. Change the phrase, choose a behavior, then disturb the composition with your pointer.</p>
<fieldset class="field"><legend>Your phrase</legend><label class="sr-only" for="phrase">Phrase to animate, up to 12 characters</label><input id="phrase" class="word-input" value="STAYCURIOUS" maxlength="12" autocomplete="off" spellcheck="false"></fieldset>
<fieldset class="field"><legend>Movement</legend><div class="modes" id="modes"><button class="mode" data-mode="wave" aria-pressed="true">Wave</button><button class="mode" data-mode="orbit" aria-pressed="false">Orbit</button><button class="mode" data-mode="scatter" aria-pressed="false">Scatter</button><button class="mode" data-mode="stack" aria-pressed="false">Stack</button></div></fieldset>
<fieldset class="field ranges"><legend>Character</legend><div class="range"><div class="range-head"><label for="speed">Tempo</label><output id="speedOut">1.0×</output></div><input id="speed" type="range" min="0.2" max="2.5" value="1" step="0.1"></div><div class="range"><div class="range-head"><label for="spread">Spread</label><output id="spreadOut">64%</output></div><input id="spread" type="range" min="20" max="100" value="64"></div><div class="range"><div class="range-head"><label for="weight">Weight</label><output id="weightOut">600</output></div><input id="weight" type="range" min="200" max="900" value="600" step="100"></div></fieldset>
<div class="actions"><button id="pause" class="action primary" aria-pressed="false">Pause motion</button><button id="reset" class="action">Reset composition</button></div>
</aside>
<main>
<section class="stage" id="stage" aria-label="Interactive animated word sculpture"><div class="axis x"></div><div class="axis y"></div><div class="sculpture" id="sculpture" aria-hidden="true"></div><div class="counter" id="counter">11 GLYPHS</div><p class="sr-only" id="phraseLive" aria-live="polite"></p></section>
<footer class="statusbar"><span class="live" id="state">LIVE RENDER</span><span class="hint">POINTER = FORCE FIELD</span><span id="modeLabel">MODE 01 / WAVE</span></footer>
</main>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), stage=$('#stage'), sculpture=$('#sculpture');
const controls={phrase:$('#phrase'),speed:$('#speed'),spread:$('#spread'),weight:$('#weight')};
let mode='wave',playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=performance.now(),glyphs=[],pointer={x:0,y:0,active:false},raf;
function build(){sculpture.textContent='';glyphs=[];const text=(controls.phrase.value||'TYPE').toUpperCase();[...text].forEach((char,i)=>{const el=document.createElement('span');el.className='glyph';el.textContent=char===' '?' ':char;sculpture.appendChild(el);glyphs.push({el,i,seed:Math.sin(i*91.7)*.5+.5});});$('#counter').textContent=glyphs.length+' GLYPH'+(glyphs.length===1?'':'S');$('#phraseLive').textContent='Animating '+text;}
function resizePointer(e){const r=stage.getBoundingClientRect();pointer.x=e.clientX-r.left-r.width/2;pointer.y=e.clientY-r.top-r.height/2;pointer.active=true;}
stage.addEventListener('pointermove',resizePointer);stage.addEventListener('pointerleave',()=>pointer.active=false);
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(playing)time+=dt*Number(controls.speed.value);const w=stage.clientWidth,h=stage.clientHeight,n=glyphs.length,spread=Number(controls.spread.value)/100;
glyphs.forEach((g,i)=>{let x=0,y=0,r=0,s=1;const center=i-(n-1)/2;
if(mode==='wave'){x=center*Math.min(w/(n+1),100)*spread*1.35;y=Math.sin(time*2+i*.58)*h*.19;r=Math.cos(time*1.6+i*.45)*12;}
if(mode==='orbit'){const a=time*.65+i/n*Math.PI*2,rx=Math.min(w*.32,280)*spread*1.35,ry=h*.25*spread*1.3;x=Math.cos(a)*rx;y=Math.sin(a)*ry;r=a*180/Math.PI+90;s=.75+Math.sin(a)*.18;}
if(mode==='scatter'){const a=i*2.399+time*.22;const radius=(.25+g.seed*.75)*Math.min(w,h)*.43*spread*1.3;x=Math.cos(a)*radius;y=Math.sin(a*1.13)*radius*.75;r=Math.sin(time+i)*35;}
if(mode==='stack'){const rows=Math.ceil(Math.sqrt(n)),col=i%rows,row=Math.floor(i/rows);x=(col-(Math.min(rows,n)-1)/2)*Math.min(w/(rows+1),130)*spread*1.3;y=(row-(Math.ceil(n/rows)-1)/2)*110+Math.sin(time*1.8+col)*18;r=Math.sin(time+row)*4;}
if(pointer.active&&playing){const dx=x-pointer.x,dy=y-pointer.y,d=Math.hypot(dx,dy),force=Math.max(0,1-d/180);if(force){x+=dx/(d||1)*force*90;y+=dy/(d||1)*force*90;r+=force*25;}}
g.el.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;});raf=requestAnimationFrame(frame);}
$('#modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#modeLabel').textContent='MODE 0'+(['wave','orbit','scatter','stack'].indexOf(mode)+1)+' / '+mode.toUpperCase();});
controls.phrase.addEventListener('input',build);
['speed','spread','weight'].forEach(key=>controls[key].addEventListener('input',()=>{if(key==='speed')$('#speedOut').value=Number(controls.speed.value).toFixed(1)+'×';if(key==='spread')$('#spreadOut').value=controls.spread.value+'%';if(key==='weight'){$('#weightOut').value=controls.weight.value;document.documentElement.style.setProperty('--weight',controls.weight.value);}}));
function updatePause(){document.body.classList.toggle('paused',!playing);$('#pause').textContent=playing?'Pause motion':'Play motion';$('#pause').setAttribute('aria-pressed',!playing);$('#state').textContent=playing?'LIVE RENDER':'MOTION PAUSED';}
$('#pause').addEventListener('click',()=>{playing=!playing;updatePause();});$('#reset').addEventListener('click',()=>{controls.phrase.value='STAYCURIOUS';controls.speed.value=1;controls.spread.value=64;controls.weight.value=600;['speed','spread','weight'].forEach(k=>controls[k].dispatchEvent(new Event('input')));time=0;build();});
build();updatePause();raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
