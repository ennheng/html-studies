<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair Up! — Memory Arcade</title>
<style>
:root{--violet:#33285e;--deep:#17152d;--mint:#baf6c8;--yellow:#ffe473;--pink:#fa779d;--blue:#74d9ed;--white:#f6f0df;--screen:#141e2c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#1e1938;color:var(--white);font-family:'Courier New',monospace;background-image:radial-gradient(#74649a33 1px,transparent 1px);background-size:18px 18px}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}.cabinet{width:min(960px,96vw);margin:24px auto;background:var(--violet);border:3px solid #0d0b1d;border-radius:25px 25px 14px 14px;box-shadow:0 0 0 5px #50427e,12px 16px 0 #100d21;overflow:hidden;position:relative}.cabinet:before,.cabinet:after{content:"";position:absolute;top:0;bottom:0;width:16px;background:repeating-linear-gradient(0deg,#fa779d 0 50px,#33285e 50px 100px);z-index:3}.cabinet:before{left:0}.cabinet:after{right:0}.marquee{margin:18px 34px 0;padding:18px;border:3px solid #17152d;border-radius:10px;background:var(--pink);text-align:center;box-shadow:inset 0 0 0 4px #ffabc0,0 5px 0 #17152d;position:relative;overflow:hidden}.marquee:before,.marquee:after{content:"★";position:absolute;color:var(--yellow);font-size:35px;top:24px}.marquee:before{left:25px}.marquee:after{right:25px}.marquee h1{font-family:Impact,'Arial Black',sans-serif;font-style:italic;font-size:clamp(38px,7vw,70px);letter-spacing:4px;line-height:1;margin:0;color:var(--yellow);text-shadow:4px 4px 0 #8d315e;-webkit-text-stroke:1px #17152d}.marquee p{font-size:10px;font-weight:bold;letter-spacing:3px;margin:8px 0 0;color:#291b41}.bezel{margin:22px 45px;background:#17152d;border:2px solid #7664a2;border-radius:14px;padding:18px;box-shadow:inset 0 0 0 5px #0e0c1d}.screen{background:var(--screen);border-radius:9px;padding:18px;box-shadow:inset 0 0 35px #000;position:relative;overflow:hidden}.screen:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#00000020 3px 4px);pointer-events:none;z-index:4}.hud{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:15px;margin-bottom:17px}.stat{border:1px solid #45616c;padding:9px 12px;background:#101822}.stat small{display:block;color:#79a5aa;font-size:9px;letter-spacing:1px;margin-bottom:5px}.stat strong{color:var(--mint);font-size:20px;text-shadow:0 0 10px #baf6c866}.stat.center{text-align:center}.stat:last-child{text-align:right}.message{text-align:center;color:var(--yellow);font-size:11px;letter-spacing:1px;min-height:16px;margin:0 0 15px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:540px;margin:auto;perspective:900px}.card{border:0;padding:0;aspect-ratio:1;background:transparent;position:relative;perspective:600px;border-radius:8px}.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.7,.2,1)}.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:7px;display:grid;place-items:center}.back{background:#43507b;border:3px solid #8391ba;box-shadow:inset 0 0 0 4px #293352,0 3px 0 #080b12}.back:before{content:"";width:40%;height:40%;border:3px solid var(--pink);transform:rotate(45deg);box-shadow:0 0 0 4px #43507b,0 0 0 6px var(--yellow)}.front{transform:rotateY(180deg);background:#e8e5cf;border:3px solid #fff9e8;box-shadow:inset 0 0 0 4px #c2bfa9,0 3px 0 #080b12}.front svg{width:68%;height:68%;overflow:visible}.card:hover:not(.flipped):not(.matched) .back{background:#556597;transform:translateY(-2px)}.card.matched .front{background:var(--mint);border-color:#eaffec;animation:match .5s}.card:disabled{cursor:default}.card.matched{animation:hop .4s}@keyframes match{50%{filter:brightness(1.5)}}@keyframes hop{50%{transform:translateY(-8px)}}.controls{margin:0 45px 25px;padding:18px 0 5px;display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center}.arcade-button{border:2px solid #131126;box-shadow:0 5px 0 #131126;padding:11px 16px;font-weight:bold;font-size:11px;letter-spacing:1px;background:var(--yellow);color:#282042;border-radius:5px}.arcade-button:hover{filter:brightness(1.1);transform:translateY(-1px)}.arcade-button:active{transform:translateY(4px);box-shadow:0 1px 0 #131126}.sound{justify-self:end;background:var(--blue)}.best{text-align:center;font-size:9px;color:#b8aecf;line-height:1.6}.best b{display:block;color:var(--white);font-size:12px}.base{background:#282048;border-top:3px solid #17152d;padding:13px 45px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:1px;color:#a89abc}.win-overlay{position:absolute;inset:0;z-index:5;background:#101829f5;display:none;place-items:center;text-align:center;padding:25px}.win-overlay.show{display:grid}.win-content h2{font-family:Impact,'Arial Black',sans-serif;color:var(--yellow);font-size:clamp(40px,7vw,66px);letter-spacing:2px;margin:0;text-shadow:4px 4px 0 #8d315e}.win-content p{color:var(--mint);font-size:13px;line-height:1.8}.win-content .arcade-button{margin-top:12px}.stars{font-size:28px;letter-spacing:8px;color:var(--pink);margin-bottom:15px}
@media(max-width:650px){.cabinet{width:100%;margin:0;border-radius:0;border-left:0;border-right:0;box-shadow:none;min-height:100vh}.cabinet:before,.cabinet:after{width:7px}.marquee{margin:13px 18px 0;padding:17px 8px}.marquee:before,.marquee:after{font-size:20px;top:23px}.marquee:before{left:10px}.marquee:after{right:10px}.marquee h1{font-size:42px}.bezel{margin:17px 17px;padding:11px}.screen{padding:12px}.hud{gap:6px}.stat{padding:8px 6px}.stat strong{font-size:16px}.stat small{font-size:7px}.board{gap:8px}.controls{margin:0 18px 20px;grid-template-columns:1fr 1fr;padding-top:15px}.best{grid-column:1/-1;grid-row:2}.arcade-button{padding:11px 8px;font-size:9px}.base{padding:13px 20px}.back{border-width:2px}.front{border-width:2px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<main class="cabinet" aria-labelledby="gameTitle"><header class="marquee"><h1 id="gameTitle">PAIR UP!</h1><p>THE MEMORY MATCHING MACHINE</p></header>
<section class="bezel" aria-label="Memory game"><div class="screen"><div class="hud"><div class="stat"><small>MOVES</small><strong id="moves">00</strong></div><div class="stat center"><small>TIME</small><strong id="time">00:00</strong></div><div class="stat"><small>PAIRS</small><strong><span id="pairs">0</span>/8</strong></div></div><p class="message" id="message" aria-live="polite">PRESS START · FIND ALL EIGHT PAIRS</p><div class="board" id="board" aria-label="Sixteen memory cards"></div><div class="win-overlay" id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="win-content"><div class="stars">★ ★ ★</div><h2 id="winTitle">HIGH SCORE!</h2><p id="winText"></p><button class="arcade-button" id="playAgain">PLAY AGAIN</button></div></div></div></section>
<div class="controls"><button class="arcade-button" id="start">START GAME</button><div class="best">PERSONAL BEST<b id="best">—</b></div><button class="arcade-button sound" id="sound" aria-pressed="true">SOUND: ON</button></div><footer class="base"><span>1 PLAYER · 8 PAIRS · INFINITE GLORY</span><span>© MOONLIGHT AMUSEMENTS</span></footer>
</main>
<script>
(()=>{'use strict';
const symbols=[{name:'Sun',color:'#f3b72f',shape:'<circle cx="50" cy="50" r="20" fill="#f3b72f"/><path d="M50 5V20M50 80v15M5 50h15M80 50h15M18 18l11 11M71 71l11 11M82 18L71 29M29 71L18 82" stroke="#e87a45" stroke-width="7"/>'},{name:'Diamond',color:'#3cacc4',shape:'<path d="M50 5L92 50 50 95 8 50Z" fill="#74d9ed" stroke="#267d9a" stroke-width="5"/><path d="M50 22L75 50 50 78 25 50Z" fill="#e8e5cf"/>'},{name:'Flower',color:'#df6289',shape:'<g fill="#fa779d"><ellipse cx="50" cy="25" rx="17" ry="24"/><ellipse cx="50" cy="75" rx="17" ry="24"/><ellipse cx="25" cy="50" rx="24" ry="17"/><ellipse cx="75" cy="50" rx="24" ry="17"/></g><circle cx="50" cy="50" r="14" fill="#ffe473"/>'},{name:'Bolt',color:'#e5b938',shape:'<path d="M58 3L18 55h29l-7 42 43-58H54Z" fill="#ffe473" stroke="#d99134" stroke-width="4" stroke-linejoin="round"/>'},{name:'Orbit',color:'#7864be',shape:'<circle cx="50" cy="50" r="24" fill="#8c79cd"/><ellipse cx="50" cy="50" rx="47" ry="15" fill="none" stroke="#fa779d" stroke-width="7" transform="rotate(-25 50 50)"/><circle cx="86" cy="32" r="6" fill="#ffe473"/>'},{name:'Mountain',color:'#579778',shape:'<path d="M4 85L41 24l17 25 12-17 27 53Z" fill="#72b790" stroke="#39775b" stroke-width="4"/><path d="M29 45l12-21 11 16-10-3-6 12Z" fill="#e8e5cf"/>'},{name:'Eye',color:'#d96976',shape:'<path d="M3 50Q50 2 97 50 50 98 3 50Z" fill="#fa9aaf" stroke="#bd506a" stroke-width="4"/><circle cx="50" cy="50" r="20" fill="#74d9ed"/><circle cx="50" cy="50" r="9" fill="#282042"/><circle cx="57" cy="43" r="4" fill="white"/>'},{name:'Moon',color:'#8b77b9',shape:'<path d="M70 7Q28 15 28 52t42 41Q11 101 5 56 0 13 70 7Z" fill="#b9a6ec" stroke="#7561a9" stroke-width="4"/><path d="M72 25l4 9 10 1-8 7 2 10-8-5-9 5 3-10-8-7 10-1Z" fill="#ffe473"/>'}];
const $=s=>document.querySelector(s);let deck=[],first=null,locked=true,moves=0,pairs=0,seconds=0,timer=null,started=false,soundOn=true,audio=null,previousFocus=null;
function safeBest(){try{return JSON.parse(localStorage.getItem('pairup-best')||'null');}catch(e){return null;}}
function displayBest(){const b=safeBest();$('#best').textContent=b?b.moves+' MOVES · '+format(b.seconds):'NO SCORE YET';}
function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function tone(freq,duration=.08,type='square',delay=0){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+delay+duration);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+duration);}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function build(){clearInterval(timer);deck=shuffle([...symbols,...symbols].map((s,i)=>({...s,id:i})));first=null;locked=true;moves=0;pairs=0;seconds=0;started=false;$('#moves').textContent='00';$('#pairs').textContent='0';$('#time').textContent='00:00';$('#message').textContent='PRESS START · FIND ALL EIGHT PAIRS';$('#start').textContent='START GAME';$('#winOverlay').classList.remove('show');$('#board').innerHTML=deck.map((c,i)=>'<button class="card" data-i="'+i+'" aria-label="Card '+(i+1)+', face down" aria-pressed="false"><span class="card-inner"><span class="face back"></span><span class="face front"><svg viewBox="0 0 100 100" aria-hidden="true">'+c.shape+'</svg></span></span></button>').join('');}
function begin(){if(started)return;started=true;locked=false;$('#start').textContent='RESTART';$('#message').textContent='CHOOSE TWO CARDS · TRUST YOUR INSTINCT';timer=setInterval(()=>{seconds++;$('#time').textContent=format(seconds);},1000);tone(440);tone(660,.1,'square',.1);}
function flip(card){const c=deck[card.dataset.i];card.classList.add('flipped');card.setAttribute('aria-pressed','true');card.setAttribute('aria-label','Card '+(Number(card.dataset.i)+1)+', '+c.name);tone(260+Number(card.dataset.i)*12,.05);}
$('#board').addEventListener('click',e=>{const card=e.target.closest('.card');if(!card||locked||card.classList.contains('flipped')||card.classList.contains('matched'))return;if(!started)begin();flip(card);if(!first){first=card;return;}moves++;$('#moves').textContent=String(moves).padStart(2,'0');const a=deck[first.dataset.i],b=deck[card.dataset.i];if(a.name===b.name){const matched=first;first=null;pairs++;$('#pairs').textContent=pairs;matched.classList.add('matched');card.classList.add('matched');matched.disabled=true;card.disabled=true;matched.setAttribute('aria-label','Matched '+a.name);card.setAttribute('aria-label','Matched '+b.name);$('#message').textContent=pairs===8?'ALL PAIRS FOUND!':'PAIR FOUND · '+a.name.toUpperCase();tone(520,.12);tone(780,.18,'square',.1);if(pairs===8)win();}else{locked=true;const old=first;first=null;$('#message').textContent='NOT A PAIR · HOLD THAT PICTURE';tone(150,.18,'sawtooth');setTimeout(()=>{[old,card].forEach((c,i)=>{c.classList.remove('flipped');c.setAttribute('aria-pressed','false');c.setAttribute('aria-label','Card '+(Number(c.dataset.i)+1)+', face down');});locked=false;$('#message').textContent='TRY AGAIN · YOU’RE GETTING WARMER';},850);}});
function win(){clearInterval(timer);locked=true;const old=safeBest(),isBest=!old||moves<old.moves||(moves===old.moves&&seconds<old.seconds);if(isBest){try{localStorage.setItem('pairup-best',JSON.stringify({moves,seconds}));}catch(e){}}displayBest();$('#winText').innerHTML=moves+' MOVES · '+format(seconds)+'<br>'+(isBest?'A NEW PERSONAL BEST. THE CROWD GOES WILD.':'A SHARP RUN. YOUR BEST IS '+old.moves+' MOVES.');previousFocus=document.activeElement;setTimeout(()=>{$('#winOverlay').classList.add('show');$('#playAgain').focus();[523,659,784,1046].forEach((n,i)=>tone(n,.25,'square',i*.12));},650);}
$('#start').addEventListener('click',()=>{if(started){build();begin();}else begin();});$('#playAgain').addEventListener('click',()=>{build();begin();$('#board .card').focus();});$('#sound').addEventListener('click',()=>{soundOn=!soundOn;$('#sound').textContent='SOUND: '+(soundOn?'ON':'OFF');$('#sound').setAttribute('aria-pressed',soundOn);if(soundOn)tone(440);});
$('#winOverlay').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();$('#playAgain').focus();}});build();displayBest();
})();
</script></body></html>
